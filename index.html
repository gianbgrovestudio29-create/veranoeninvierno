<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>VERANO EN INVIERNO</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#000;
font-family:'Montserrat',sans-serif;
overflow-x:hidden;
color:white;
}

/* FONDO */

.hero{
position:relative;
min-height:100vh;
background:
linear-gradient(to right, rgba(0,0,0,.75), rgba(0,0,0,.35)),
url('cover1.jpg');
background-size:cover;
background-position:center;
overflow:hidden;
}

/* OSCURECER */

.hero::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(to bottom,
rgba(0,0,0,.2),
rgba(0,0,0,.55),
rgba(0,0,0,.92));
z-index:1;
}

/* PERSONAJE */

.personaje{
position:absolute;
right:-30px;
bottom:0;
height:95vh;
z-index:2;
pointer-events:none;
filter:
drop-shadow(0 0 25px rgba(0,140,255,.6))
drop-shadow(0 0 80px rgba(0,140,255,.35));
animation:float 5s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}
}

/* CONTENIDO */

.content{
position:relative;
z-index:5;
padding:70px 70px 120px;
max-width:850px;
}

/* TEXTO ARRIBA */

.presentan{
font-size:15px;
letter-spacing:10px;
color:#ffffffd8;
margin-bottom:15px;
}

/* TITULO */

.title{
line-height:.85;
margin-bottom:35px;
}

.title .pink{
display:block;
font-size:9rem;
font-weight:900;
color:#ff0a8a;
text-shadow:
0 0 10px #ff0a8a,
0 0 25px #ff0a8a,
0 0 55px rgba(255,0,128,.9);
}

.title .blue{
display:block;
font-size:8rem;
font-weight:900;
color:#55adff;
text-shadow:
0 0 10px #55adff,
0 0 25px #55adff,
0 0 60px rgba(0,140,255,.95);
}

/* TEXTO */

.desc{
font-family:'Caveat',cursive;
font-size:2rem;
line-height:1.7;
max-width:720px;
color:white;
text-shadow:0 0 10px rgba(0,0,0,.9);
margin-bottom:45px;
}

/* BOTONES */

.buttons{
display:flex;
gap:25px;
flex-wrap:wrap;
}

.btn{
padding:22px 42px;
border-radius:999px;
text-decoration:none;
font-weight:800;
font-size:1rem;
transition:.35s;
}

.btn-primary{
background:linear-gradient(90deg,#ff008c,#4ea5ff);
color:white;
box-shadow:0 0 30px rgba(255,0,140,.5);
}

.btn-primary:hover{
transform:translateY(-5px) scale(1.03);
}

.btn-secondary{
border:2px solid rgba(255,255,255,.2);
color:white;
backdrop-filter:blur(10px);
background:rgba(255,255,255,.05);
}

.btn-secondary:hover{
background:rgba(255,255,255,.1);
transform:translateY(-5px);
}

/* FOOTER */

.bottom{
position:absolute;
bottom:25px;
left:60px;
right:60px;
z-index:6;
display:flex;
justify-content:space-between;
align-items:end;
flex-wrap:wrap;
gap:20px;
}

.credit{
font-size:1.5rem;
font-weight:900;
}

.credit span{
color:#ff0a8a;
}

.parental{
width:100px;
opacity:.95;
}

/* IDIOMA */

.language{
position:absolute;
top:20px;
right:20px;
z-index:10;
}

.language select{
background:#111;
border:none;
color:white;
padding:12px 18px;
border-radius:14px;
font-weight:700;
outline:none;
}

/* RESPONSIVE */

@media(max-width:1100px){

.title .pink{
font-size:6rem;
}

.title .blue{
font-size:5.5rem;
}

.personaje{
height:80vh;
right:-120px;
opacity:.85;
}

}

@media(max-width:768px){

.content{
padding:50px 28px 140px;
}

.presentan{
font-size:11px;
letter-spacing:5px;
}

.title .pink{
font-size:4.2rem;
}

.title .blue{
font-size:4rem;
}

.desc{
font-size:1.45rem;
line-height:1.6;
}

.buttons{
flex-direction:column;
align-items:flex-start;
}

.btn{
width:100%;
text-align:center;
}

.personaje{
height:60vh;
right:-120px;
opacity:.45;
}

.bottom{
left:25px;
right:25px;
}

.credit{
font-size:1rem;
}

.parental{
width:75px;
}

}

</style>
</head>

<body>

<section class="hero">

<!-- IDIOMA -->

<div class="language">
<select>
<option>ES Español</option>
<option>EN English</option>
<option>PT Português</option>
</select>
</div>

<!-- PERSONAJE -->

<img src="personaje.png" class="personaje">

<!-- CONTENIDO -->

<div class="content">

<p class="presentan">
DJ GIAN C & GROVE STUDIO PRESENTAN
</p>

<h1 class="title">
<span class="pink">VERANO</span>
<span class="blue">INVIERNO</span>
</h1>

<p class="desc">
18 canciones inspiradas en playas vacías,
fuego azul, madrugadas eternas,
corazones rotos y recuerdos
que todavía siguen vivos.
</p>

<div class="buttons">

<a href="#" class="btn btn-primary">
ENTRAR AL ÁLBUM
</a>

<a href="https://www.youtube.com/@GroveStudio_ofi" target="_blank" class="btn btn-secondary">
ESCUCHAR PRONTO
</a>

</div>

</div>

<!-- FOOTER -->

<div class="bottom">

<div class="credit">
DJ GiAN C <span>×</span> GROVE STUDIO
</div>

<img src="cover2.jpg" class="parental">

</div>

</section>

</body>
</html>
